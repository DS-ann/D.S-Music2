name: Build and upload D.S Music Android 6+ APK

on:
  workflow_call:
    inputs:
      source_ref:
        description: D.S Music branch, tag, or commit to build
        required: false
        type: string
        default: master
  push:
    branches: [ master, 'fix/download-metadata-cache-playback' ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android6-apk.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: D.S Music branch, tag, or commit to build
        required: true
        type: string
        default: master

permissions:
  contents: read

concurrency:
  group: dsmusic-arm64-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign, compress, upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: DS-ann/D.S-Music2
          ref: ${{ inputs.source_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 17 SDK and Build Tools
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Compile ARM64-v8a release APK
        run: gradle --no-daemon --warning-mode all assembleRelease

      - name: Sign with shared D.S-Apps release key and highly compress APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
          SIGNING_KEYSTORE_TYPE: PKCS12
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing the base64-encoded release keystore secret}"
          : "${SIGNING_KEYSTORE_PASSWORD:?Missing the release keystore password secret}"
          : "${SIGNING_KEY_ALIAS:?Missing the release key alias secret}"
          : "${SIGNING_KEY_PASSWORD:?Missing the release key password secret}"
          KEYSTORE="$RUNNER_TEMP/dsmusic-release-keystore"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE" -storepass "$SIGNING_KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
          echo "Shared D.S-Apps PKCS12 signing key validated."

          BUILD_DIR="app/build/outputs/apk/release"
          SOURCE_APK="$BUILD_DIR/app-arm64-v8a-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/D.S-Music-arm64-v8a-aligned.apk"
          OUTPUT_APK="$BUILD_DIR/dsmusic.apk"
          OUTPUT_ZIP="$BUILD_DIR/dsmusic.zip"
          ZIPALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          APK_SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          "$ZIPALIGN" -f -p 4 "$SOURCE_APK" "$ALIGNED_APK"
          "$APK_SIGNER" sign \
            --ks "$KEYSTORE" --ks-type "$SIGNING_KEYSTORE_TYPE" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$OUTPUT_APK" "$ALIGNED_APK"

          zip -9 -j "$OUTPUT_ZIP" "$OUTPUT_APK"

      - name: Upload compressed signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: music
          path: app/build/outputs/apk/release/dsmusic.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
