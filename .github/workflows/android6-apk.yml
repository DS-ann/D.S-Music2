name: Build and upload SpatialFlow Android 6+ APK

on:
  workflow_call:
    inputs:
      source_ref:
        description: SpatialFlow branch, tag, or commit to build
        required: false
        type: string
        default: master
  push:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android6-apk.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: SpatialFlow branch, tag, or commit to build
        required: true
        type: string
        default: master

permissions:
  contents: read

concurrency:
  group: spatialflow-arm64-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign, compress, upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: DS-ann/SpatialFlow
          ref: ${{ inputs.source_ref || 'master' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 17 SDK and Build Tools
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Compile ARM64-v8a release APK
        run: gradle --no-daemon assembleRelease

      - name: Sign with repository release key and highly compress APK
        env:
          # Preferred names plus common alternatives; repository secrets themselves are never printed.
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          SIGNING_KEYSTORE_TYPE: ${{ secrets.SIGNING_KEYSTORE_TYPE || secrets.ANDROID_KEYSTORE_TYPE || 'JKS' }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing the base64-encoded release keystore secret}"
          : "${SIGNING_KEYSTORE_PASSWORD:?Missing the release keystore password secret}"
          : "${SIGNING_KEY_ALIAS:?Missing the release key alias secret}"
          : "${SIGNING_KEY_PASSWORD:?Missing the release key password secret}"

          BUILD_DIR="app/build/outputs/apk/release"
          SOURCE_APK="$BUILD_DIR/app-arm64-v8a-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/SpatialFlow-arm64-v8a-aligned.apk"
          OUTPUT_APK="$BUILD_DIR/SpatialFlow-arm64-v8a-Android6-release.apk"
          OUTPUT_ZIP="$BUILD_DIR/SpatialFlow-arm64-v8a-Android6-release.zip"
          KEYSTORE="$RUNNER_TEMP/spatialflow-release-keystore"
          ZIPALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          APK_SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          "$ZIPALIGN" -f -p 4 "$SOURCE_APK" "$ALIGNED_APK"
          "$APK_SIGNER" sign \
            --ks "$KEYSTORE" --ks-type "$SIGNING_KEYSTORE_TYPE" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$OUTPUT_APK" "$ALIGNED_APK"

          zip -9 -j "$OUTPUT_ZIP" "$OUTPUT_APK"

      - name: Upload compressed signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpatialFlow-arm64-v8a-Android6-release
          path: app/build/outputs/apk/release/SpatialFlow-arm64-v8a-Android6-release.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
