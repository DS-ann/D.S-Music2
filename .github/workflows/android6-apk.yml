name: Build and Sign SpatialFlow APK (Android 6+)

on:
  workflow_call:
    inputs:
      source_ref:
        description: SpatialFlow branch, tag, or commit to build
        required: false
        type: string
        default: master
      run_api23_smoke_test:
        description: Run the optional Android 6 emulator smoke test
        required: false
        type: boolean
        default: false
    secrets:
      BATTERYPULSE_KEYSTORE_BASE64:
        required: true
      BATTERYPULSE_STORE_PASSWORD:
        required: true
      BATTERYPULSE_KEY_ALIAS:
        required: true
      BATTERYPULSE_KEY_PASSWORD:
        required: true
  push:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android6-apk.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      source_ref:
        description: SpatialFlow branch, tag, or commit to build
        required: true
        type: string
        default: master
      run_api23_smoke_test:
        description: Run optional Android 6 emulator smoke test (may be slow on hosted runners)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spatialflow-android6-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: DS-ann/SpatialFlow
          ref: ${{ inputs.source_ref || 'master' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle without cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 17 SDK and Build Tools
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Prepare launcher signing key when secrets are configured
        id: signing
        env:
          BATTERYPULSE_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$BATTERYPULSE_KEYSTORE_BASE64" ] || [ -z "$BATTERYPULSE_STORE_PASSWORD" ] || [ -z "$BATTERYPULSE_KEY_ALIAS" ] || [ -z "$BATTERYPULSE_KEY_PASSWORD" ]; then
            echo "SPATIALFLOW_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Launcher signing secrets were not supplied to this run. The release can be compiled and smoke-tested, but no APK will be published."
            exit 0
          fi
          printf '%s' "$BATTERYPULSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/batterypulse-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/batterypulse-release.p12" -storepass "$BATTERYPULSE_STORE_PASSWORD" -alias "$BATTERYPULSE_KEY_ALIAS" >/dev/null
          chmod 600 "$RUNNER_TEMP/batterypulse-release.p12"
          echo "BATTERYPULSE_KEYSTORE_PATH=$RUNNER_TEMP/batterypulse-release.p12" >> "$GITHUB_ENV"
          echo "SPATIALFLOW_SIGNING_READY=true" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Launcher PKCS#12 signing key validated."

      - name: Clean and build release variant
        env:
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon --no-build-cache --no-configuration-cache --stacktrace clean assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build attempt $attempt failed; retrying in case of a transient dependency repository error."
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Run Android Lint for API compatibility
        id: android_lint
        continue-on-error: true
        run: gradle --no-daemon --no-build-cache --no-configuration-cache lintRelease

      - name: Print Android Lint diagnostics
        if: steps.android_lint.outcome == 'failure'
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt"
          if [ -f "$REPORT" ]; then
            echo "Existing project lint backlog (first 100 diagnostic lines):"
            grep -E 'Error:|Warning:' "$REPORT" | head -n 100 || true
          else
            echo "Lint report file was not generated."
          fi

      - name: Smoke-test install and launch on Android 6 (API 23)
        id: api23_smoke
        if: inputs.run_api23_smoke_test
        timeout-minutes: 12
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: default
          arch: arm64-v8a
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/android6-smoke-test.sh

      - name: Classify Android 6 emulator smoke-test result
        if: steps.api23_smoke.outcome == 'failure'
        env:
          SMOKE_SCRIPT_STARTED: ${{ runner.temp }}/spatialflow-api23-smoke-started
        run: |
          set -euo pipefail
          if [ -f "$SMOKE_SCRIPT_STARTED" ]; then
            echo "::error::The API 23 emulator started, but the app install/start smoke test failed."
            exit 1
          fi
          echo "::warning::The emulator failed before the API 23 smoke-test script could start. Android 6 runtime behavior is unverified; continuing to signing checks."

      - name: Explain skipped APK publishing when signing secrets are not supplied
        if: steps.signing.outputs.ready != 'true'
        run: echo "::warning::No signed APK was published from this run. Use the launcher repository workflow to pass its existing signing secrets."

      - name: Verify APK signature and label output
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          OUTPUT_APK="app/build/outputs/apk/release/SpatialFlow-arm64-v8a-Android6-release.apk"
          APK_SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -s "$SOURCE_APK"
          test -x "$APK_SIGNER"
          APK_COUNT="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          test "$APK_COUNT" -eq 1
          cp "$SOURCE_APK" "$OUTPUT_APK"
          "$APK_SIGNER" verify --verbose "$OUTPUT_APK"
          echo "Verified signed ARM64-v8a APK: $OUTPUT_APK"
          echo "Expected single ABI output: arm64-v8a"

      - name: Upload signed ARM64-v8a APK as a single-file artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SpatialFlow-arm64-v8a-Android6-release-APK
          path: app/build/outputs/apk/release/SpatialFlow-arm64-v8a-Android6-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
