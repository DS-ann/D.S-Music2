name: Build and upload SpatialFlow Android 6+ APK

on:
  workflow_call:
    inputs:
      source_ref:
        description: SpatialFlow branch, tag, or commit to build
        required: false
        type: string
        default: master
  push:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android6-apk.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: SpatialFlow branch, tag, or commit to build
        required: true
        type: string
        default: master

permissions:
  contents: read

concurrency:
  group: spatialflow-arm64-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign, compress, upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: DS-ann/SpatialFlow
          ref: ${{ inputs.source_ref || 'master' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 17 SDK and Build Tools
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Compile ARM64-v8a release APK
        run: gradle --no-daemon assembleRelease

      - name: Sign and highly compress APK
        run: |
          set -euo pipefail
          BUILD_DIR="app/build/outputs/apk/release"
          SOURCE_APK="$BUILD_DIR/app-arm64-v8a-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/SpatialFlow-arm64-v8a-aligned.apk"
          OUTPUT_APK="$BUILD_DIR/SpatialFlow-arm64-v8a-Android6-release.apk"
          OUTPUT_ZIP="$BUILD_DIR/SpatialFlow-arm64-v8a-Android6-release.zip"
          KEYSTORE="$RUNNER_TEMP/spatialflow-temporary-signing-key.p12"
          ZIPALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          APK_SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"

          export TEMP_SIGNING_PASSWORD="$(openssl rand -hex 32)"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$TEMP_SIGNING_PASSWORD" -keypass "$TEMP_SIGNING_PASSWORD" \
            -alias spatialflow-temporary \
            -dname "CN=SpatialFlow Temporary Release, OU=Build, O=DS-ann, C=IN" \
            -keyalg RSA -keysize 2048 -validity 10000
          chmod 600 "$KEYSTORE"

          "$ZIPALIGN" -f -p 4 "$SOURCE_APK" "$ALIGNED_APK"
          "$APK_SIGNER" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias spatialflow-temporary \
            --ks-pass env:TEMP_SIGNING_PASSWORD \
            --key-pass env:TEMP_SIGNING_PASSWORD \
            --out "$OUTPUT_APK" "$ALIGNED_APK"

          zip -9 -j "$OUTPUT_ZIP" "$OUTPUT_APK"

      - name: Upload compressed signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpatialFlow-arm64-v8a-Android6-release
          path: app/build/outputs/apk/release/SpatialFlow-arm64-v8a-Android6-release.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
