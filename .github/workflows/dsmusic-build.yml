name: Build D.S Music (dsmusic)

on:
  push:
    branches: [dsmusic]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/dsmusic-build.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build variant
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: dsmusic-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout dsmusic branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 17 SDK and Build Tools
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Assemble APK
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type || 'release' }}" = "debug" ]; then
            gradle --no-daemon --warning-mode all assembleDebug
            mkdir -p app/build/outputs/apk/dsmusic-artifact
            cp app/build/outputs/apk/arm64-v8a/debug/*.apk app/build/outputs/apk/dsmusic-artifact/dsmusic-debug.apk
          else
            gradle --no-daemon --warning-mode all assembleRelease
            mkdir -p app/build/outputs/apk/dsmusic-artifact
            SOURCE_APK="$(find app/build/outputs/apk -type f -name '*arm64-v8a*release*.apk' -o -name '*release-unsigned.apk' | head -n 1)"
            test -n "$SOURCE_APK"
            cp "$SOURCE_APK" app/build/outputs/apk/dsmusic-artifact/dsmusic-release-unsigned.apk
          fi

      - name: Sign release APK with shared D.S-Apps key when available
        if: ${{ (inputs.build_type == '' || inputs.build_type == 'release') && secrets.BATTERYPULSE_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/dsmusic-release-keystore.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE" -storepass "$SIGNING_KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          SOURCE_APK="app/build/outputs/apk/dsmusic-artifact/dsmusic-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/dsmusic-aligned.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$SOURCE_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --out app/build/outputs/apk/dsmusic-artifact/dsmusic.apk "$ALIGNED_APK"
          rm "$SOURCE_APK" "$ALIGNED_APK"

      - name: Verify release APK when signing key is configured
        if: ${{ (inputs.build_type == '' || inputs.build_type == 'release') && secrets.BATTERYPULSE_KEYSTORE_BASE64 != '' }}
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose app/build/outputs/apk/dsmusic-artifact/dsmusic.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: D.S-Music-dsmusic-${{ inputs.build_type || 'release' }}
          path: app/build/outputs/apk/dsmusic-artifact/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
